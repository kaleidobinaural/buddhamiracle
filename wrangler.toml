# Temple of Light — Cloudflare Pages Deployment Config
# https://developers.cloudflare.com/pages/framework-guides/nextjs/

name = "temple-of-light"
compatibility_date = "2024-09-23"
compatibility_flags = ["nodejs_compat"]

# ★ All secrets must be set via Cloudflare Dashboard → Settings → Environment Variables
# NEVER put actual secret values in this file.

[env.production]
# These are PUBLIC variables only. Add secrets via the dashboard.
[env.production.vars]
NODE_ENV = "production"
NEXTAUTH_URL = "https://your-domain.pages.dev"  # Replace with your actual domain

[env.preview]
[env.preview.vars]
NODE_ENV = "development"
